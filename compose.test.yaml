# E2E gegen das Runtime-Image: App, Fixture-Server und Playwright.
#   npm run test:e2e
name: videoloader-test

services:
  # Nicht „app“: Chrome erzwingt für die TLD .app per HSTS-Preload HTTPS.
  videoloader:
    build:
      context: .
      target: runtime
    init: true
    tmpfs:
      - /data:uid=1000,gid=1000
    ports:
      - "3000"

  fixtures:
    build:
      context: .
      target: base
    working_dir: /fixtures
    command: ["node", "server.ts"]
    environment:
      FIXTURE_CACHE: /cache
      PORT: "8080"
    volumes:
      - ./test/fixtures:/fixtures:ro
      - fixture-cache:/cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

  e2e:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    environment:
      BASE_URL: http://videoloader:3000
      FIXTURE_URL: http://fixtures:8080
      CI: ${CI:-}
    volumes:
      - ./test-results:/e2e/test-results
    depends_on:
      videoloader:
        condition: service_healthy
      fixtures:
        condition: service_healthy

volumes:
  fixture-cache:
